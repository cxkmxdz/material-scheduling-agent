[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "material-scheduling-agent"
version = "0.1.0"
description = "Question 1: evidence-guarded material review and draft scheduling agent"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "pydantic==2.12.3", "python-dotenv==1.2.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
scheduling-agent = "scheduling_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduling_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
